---
# Скопируйте в group_vars/all.yml (он в .gitignore) и заполните.

# --- Доступ ---
deploy_user: deploy
# Ваш уже существующий пользователь, под которым вы заходите сейчас.
# Он остаётся в AllowUsers, чтобы вы не потеряли доступ.
admin_user: ubuntu
ssh_port: 22
# Публичные ключи (.pub), которым разрешён вход под deploy_user.
deploy_authorized_keys:
  - "ssh-ed25519 AAAA... github-actions-deploy"

# --- GitHub ---
# Путь к ПРИВАТНОМУ ключу на машине, где запускается Ansible. Роль github_ssh
# положит его пользователю deploy, и клонирование пойдёт по SSH.
git_ssh_private_key_file: /home/ubuntu/.ssh/github_key

# --- Firewall: порты, открытые наружу (SSH открывается отдельно) ---
public_ports:
  - 80
  - 443

# --- nginx (роль nginx): TLS, проксирование и кэш картинок ---
# Перед запуском A-записи api.* и media.* должны указывать на этот сервер.
nginx_certbot_email: you@example.com
nginx_sites:
  - name: api
    server_name: api.notrecinema.ru
    upstream: http://127.0.0.1:8090
    client_max_body_size: 6m
  - name: media
    server_name: media.notrecinema.ru
    upstream: http://127.0.0.1:8333
    cache: true
    path_prefix: /notrecinema-images/

# --- Мониторинг (роль monitoring): VictoriaMetrics + vmalert + Grafana ---
# Включайте после первого запуска стека приложения: роли нужна его docker-сеть.
# Запуск: ansible-playbook site.yml --tags monitoring --ask-become-pass
# Чтобы открыть Grafana наружу, добавьте сайт в nginx_sites (ниже) и A-запись
# grafana.notrecinema.ru на этот сервер:
#   - name: grafana
#     server_name: grafana.notrecinema.ru
#     upstream: http://127.0.0.1:3001
monitoring_enabled: false
# Не короче 12 символов. Значение хранится в зашифрованном group_vars/all/vault.yml
# (scripts/vault-init.sh создаёт его со случайным паролем).
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_root_url: https://grafana.notrecinema.ru

# --- Приложения: что клонировать на сервер (роль app_checkout) ---
# repo -- только SSH-адрес (git@github.com:org/repo.git).
apps:
  - name: notrecinema-api
    repo: git@github.com:co-visionnage/notrecinema-api.git
    dest: /opt/notrecinema
    version: main
  # Схема БД: нужна docker-compose.prod.yml (init.sh и сборка контейнера миграций).
  - name: notrecinema-schema
    repo: git@github.com:co-visionnage/database.git
    dest: /opt/notrecinema-schema
    version: main
