---
# Группу docker создаём заранее: пакет docker-ce подхватит уже существующую,
# а роль не зависит от порядка запуска.
- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: docker
    append: true
    password_lock: true

- name: Authorize SSH keys for the deploy user
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ deploy_authorized_keys }}"
