---
# Обязательно: почта для Let's Encrypt (уведомления об истечении сертификата).
nginx_certbot_email: ""

# Список сайтов. Поля каждого:
#   name                 имя файла конфига (conf.d/<name>.conf)
#   server_name          домен
#   upstream             куда проксировать, например http://127.0.0.1:8090
#   client_max_body_size лимит тела запроса (по умолчанию 1m)
#   cache                true -- кэшировать ответы и пускать только GET/HEAD
#   path_prefix          если задан, наружу отдаётся только этот путь (остальное 404)
#   browser_cache        срок кэша в браузере для cache: true (по умолчанию 30d)
nginx_sites: []

nginx_webroot: /var/www/certbot
nginx_cache_path: /var/cache/nginx/media
nginx_cache_size: 2g
nginx_cache_valid: 30d
