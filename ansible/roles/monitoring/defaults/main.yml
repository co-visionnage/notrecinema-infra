---
# Мониторинг: VictoriaMetrics (хранилище метрик) + vmalert (правила алертов) +
# Grafana + node-exporter (метрики самого сервера).
#
# Роль выключена по умолчанию: ей нужен уже запущенный стек приложения (она
# подключается к его docker-сети, чтобы забирать метрики api и воркера).
# Включение: monitoring_enabled: true в group_vars/all.yml, затем
#   ansible-playbook site.yml --tags monitoring --ask-become-pass
monitoring_enabled: false

monitoring_dir: /opt/monitoring

# Сеть стека приложения (docker-compose.prod.yml, сеть notrecinema-net).
monitoring_app_network: notrecinema-net

# Куда Prometheus-эндпоинты приложения смотрят внутри этой сети.
monitoring_api_target: api:8080
monitoring_worker_target: worker:8081

# Образы. latest -- чтобы роль не зависела от того, какие теги живы на момент
# запуска; для воспроизводимости закрепите версии здесь.
victoriametrics_image: victoriametrics/victoria-metrics:latest
vmalert_image: victoriametrics/vmalert:latest
grafana_image: grafana/grafana-oss:latest
node_exporter_image: prom/node-exporter:latest

# Сколько хранить метрики.
victoriametrics_retention: 90d
# Как часто забирать метрики.
monitoring_scrape_interval: 15s

# Grafana. Пароль администратора обязателен (group_vars/all.yml, лучше через
# ansible-vault). Наружу Grafana отдаётся через nginx-сайт (см. пример в
# group_vars/all.example.yml), сам контейнер слушает только loopback.
grafana_admin_user: admin
grafana_admin_password: ""
grafana_root_url: "http://localhost:3001"
grafana_host_port: 3001

# Порт VictoriaMetrics на loopback сервера: для ssh-туннеля и отладки.
victoriametrics_host_port: 8428
